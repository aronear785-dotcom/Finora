name: Build FINORA APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Unzip FINORA project
        run: unzip -o FINORA.zip

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 🚀 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 🔎 Flutter Version
        run: flutter --version

      - name: 🔧 Fix Android Config
        working-directory: FINORA
        run: |
          FILE=$(find android -name "build.gradle*" | grep app | head -n 1)

          if [ -n "$FILE" ]; then
            sed -i 's/compileSdk *= *[0-9]*/compileSdk = 36/g' "$FILE"

            grep -q "ndkVersion" "$FILE" || \
            sed -i '/android {/a \    ndkVersion = "28.2.13676358"' "$FILE"
          fi

      - name: 🔧 Fix Dependency Conflict
        working-directory: FINORA
        run: |
          echo "Checking dependency versions..."

          # Update flutter_local_notifications to a version
          # compatible with timezone 0.10.x
          sed -i -E \
            's/(flutter_local_notifications:[[:space:]]*)\^?17\.[0-9]+\.[0-9]+/\118.0.1/' \
            pubspec.yaml

          # Keep timezone on the 0.10.x branch
          sed -i -E \
            's/(timezone:[[:space:]]*)\^?0\.10\.[0-9]+/\1^0.10.1/' \
            pubspec.yaml

          echo "Updated dependencies:"
          grep -E "flutter_local_notifications:|timezone:" pubspec.yaml || true

      - name: 📦 Install Dependencies
        working-directory: FINORA
        run: flutter pub get

      - name: 🧹 Clean Project
        working-directory: FINORA
        run: flutter clean

      - name: 📦 Get Dependencies Again
        working-directory: FINORA
        run: flutter pub get

      - name: 🏗 Build Release APK
        working-directory: FINORA
        run: |
          flutter build apk --release \
          --split-per-abi \
          --shrink

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FINORA-APK
          path: |
            FINORA/build/app/outputs/flutter-apk/*arm64-v8a-release.apk
          retention-days: 1
