name: Build FINORA APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Unzip FINORA project
        run: unzip -o FINORA.zip

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 🚀 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 🔎 Check versions
        run: |
          flutter --version
          java -version

      - name: 🔧 Update Gradle
        working-directory: FINORA
        run: |
          sed -i \
            's#gradle-[0-9.]*-\(bin\|all\)\.zip#gradle-8.14-bin.zip#g' \
            android/gradle/wrapper/gradle-wrapper.properties

          echo "Gradle configuration:"
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: 🔧 Configure Android
        working-directory: FINORA
        run: |
          if [ -f android/app/build.gradle ]; then
            sed -i -E \
              's/compileSdk[[:space:]]*=?[[:space:]]*[0-9]+/compileSdk = 36/g' \
              android/app/build.gradle
          fi

          if [ -f android/app/build.gradle.kts ]; then
            sed -i -E \
              's/compileSdk[[:space:]]*=?[[:space:]]*[0-9]+/compileSdk = 36/g' \
              android/app/build.gradle.kts
          fi

      - name: 📦 Install dependencies
        working-directory: FINORA
        run: flutter pub get

      - name: 🧹 Clean project
        working-directory: FINORA
        run: flutter clean

      - name: 📦 Get dependencies again
        working-directory: FINORA
        run: flutter pub get

      - name: 🏗 Build Release APK
        working-directory: FINORA
        run: flutter build apk --release --shrink

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FINORA-APK
          path: FINORA/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
